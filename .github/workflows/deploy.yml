# GitHub Pages へのビルド & デプロイ。
# 前提（手動設定）: Settings → Pages → Source を "GitHub Actions" にすること。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages デプロイに必要な最小権限のみ。
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを避けつつ、進行中のデプロイをキャンセルしない。
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate data
        run: npm run validate-data

      - name: Build
        run: npm run build
        env:
          # base パスと Issue リンクをリポジトリから自動導出する
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
