# 毎時の配合候補の更新（追加開発指示 §7）。
# 保存済みの作品データからスロット単位で最大6件を決定的に選出し、
# data/current-candidates.json を更新する。ProtoPedia APIは呼ばない（トークン不要）。
# - 同じスロットなら常に同じ候補（再実行しても結果は同じ）
# - Actionsの実行遅延は generatedAt / slot を JSON に記録して UI 側で正直に表示する
# - 失敗時（プール0件など）はジョブが止まり、既存の JSON は無変更
name: Rotate candidates

on:
  schedule:
    - cron: '4 * * * *' # 毎時（正時の厳密な実行は要求しない。遅延時は実行時刻の時間帯をスロットにする）
  workflow_dispatch:
    inputs:
      slot:
        description: '候補スロット（YYYY-MM-DDTHH, UTC）。省略時は実行時刻'
        required: false

# data/current-candidates.json のコミットに必要な最小権限のみ。
permissions:
  contents: write

concurrency:
  group: rotate-candidates
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # 依存インストールなし（スクリプトはNode標準ライブラリのみ使用）。
      # 手動 dispatch の slot 入力はシェルへ直接展開せず env 経由で渡す
      # （外部入力をコマンド文字列へ埋め込まない）。スクリプト側でも形式を検証する。
      - name: Rotate candidates
        env:
          SLOT_INPUT: ${{ inputs.slot }}
        run: |
          if [ -n "$SLOT_INPUT" ]; then
            node --experimental-strip-types scripts/rotate-candidates.ts --slot="$SLOT_INPUT"
          else
            node --experimental-strip-types scripts/rotate-candidates.ts
          fi

      - name: Commit updated candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current-candidates.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(data): 配合候補を更新 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
