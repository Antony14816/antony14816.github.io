# Issue種別の自動ラベル付け（issue #13）。
# - 配合申請（[Breed] タイトル + 本文 parent_a/parent_b 行）→ breeding-request
# - それ以外（機能追加・バグ報告など）→ enhancement
# ラベルはワークフロー側で管理する（AGENTS.md: 利用者が付けた前提にしない）。
# Issue本文はシェル・Actions式へ埋め込まない（渡すのは番号だけ。本文はスクリプトがAPIから取得）。
name: label-issues

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Classify and apply label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node --experimental-strip-types scripts/label-issue.ts
