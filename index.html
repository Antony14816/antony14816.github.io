<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202735" />
    <meta name="description" content="20年分の発明を、もう一度マッシュアップ。ProtoPedia作品の交配から新しい発明アイデアを生み出す16bit交配研究所。" />
    <title>Mashup Ours — 20年分の発明を、もう一度マッシュアップ。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // テーマの早期適用（白/黒フラッシュ防止）。保存 > OS設定 の順。
      (function () {
        try {
          var t = localStorage.getItem('mashup-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var el = document.documentElement;
          el.dataset.theme = t;
          el.style.background = t === 'dark' ? '#202735' : '#FFF5DE';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#202735' : '#FFF5DE');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
